[project]
name = "throwaway-testing"
version = "0.1.0"
authors = [
    { name = "ralph", email = "ralph@pricing-frontier.co.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "haute",
]

[tool.uv.sources]
haute = { path = "C:/Users/ralph/haute", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
]

[tool.mypy]
ignore_missing_imports = false
# The pipeline imports its utility and submodel modules from its own folder, as
# Python does when it runs rating/main.py.
mypy_path = "rating"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["haute.*", "catboost.*", "xgboost.*", "lightgbm.*", "sklearn.*"]
ignore_missing_imports = true
